name: Knowledge PDF Worker

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "ID del PDF en Google Drive"
        required: true
        type: string
      chunk_pages:
        description: "Páginas por bloque"
        required: false
        default: "3"
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r workers/knowledge_pdf_worker/requirements.txt
      - name: Procesar PDF desde Drive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python workers/knowledge_pdf_worker/worker.py \
            --process \
            --file-id "${{ inputs.drive_file_id }}" \
            --chunk-pages "${{ inputs.chunk_pages }}"
